name: Checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/claimcheck-api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix src/claimcheck-api
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
